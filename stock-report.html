<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票研究報告產生器</title>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f0f0f;
    --paper: #faf8f3;
    --cream: #f2ede3;
    --accent: #003087;
    --accent-light: #f0e8e5;
    --gold: #E2001A;
    --muted: #6b6560;
    --border: #d8d0c4;
    --green: #1a6b3c;
    --red: #c8381a;
    --section-bg: #ffffff;
    --gemini-blue: #1a73e8;
    --claude-orange: #d97706;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── SCREEN UI ── */
  .screen-ui {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  .masthead { text-align: center; margin-bottom: 36px; }

  .input-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 32px 36px;
    width: 100%;
    max-width: 600px;
    box-shadow: 4px 4px 0 var(--border);
  }

  /* ── API SETTINGS SECTION ── */
  .api-settings-section {
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .section-row-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    font-weight: 500;
    display: block;
  }

  /* Provider Toggle Pills */
  .provider-toggle {
    display: flex;
    gap: 0;
    margin-bottom: 14px;
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    width: 100%;
  }

  .provider-btn {
    flex: 1;
    padding: 10px 0;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    transition: background 0.18s, color 0.18s;
    background: var(--paper);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  .provider-btn:not(:last-child) { border-right: 1px solid var(--border); }

  .provider-btn.active[data-provider="gemini"] {
    background: var(--gemini-blue);
    color: white;
  }

  .provider-btn.active[data-provider="claude"] {
    background: var(--claude-orange);
    color: white;
  }

  .provider-btn svg { flex-shrink: 0; }

  /* Model Selector */
  .model-select-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .model-select-row label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    font-weight: 500;
  }

  .model-pill-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
  }

  .model-pill {
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--paper);
    color: var(--muted);
    white-space: nowrap;
  }

  .model-pill:hover { border-color: var(--ink); color: var(--ink); }

  .model-pill.active[data-provider="gemini"] {
    background: var(--gemini-blue);
    border-color: var(--gemini-blue);
    color: white;
  }

  .model-pill.active[data-provider="claude"] {
    background: var(--claude-orange);
    border-color: var(--claude-orange);
    color: white;
  }

  /* Model info badge */
  .model-info-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--muted);
    background: var(--paper);
    border: 1px solid var(--border);
    padding: 4px 9px;
    border-radius: 2px;
    margin-bottom: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .model-info-badge span.dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    display: inline-block;
  }

  .model-info-badge.gemini .dot { background: var(--gemini-blue); }
  .model-info-badge.claude .dot { background: var(--claude-orange); }

  /* API Key Input */
  .apikey-row { margin-bottom: 0; }

  .apikey-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
  }

  .apikey-wrap input {
    flex: 1;
    padding: 10px 36px 10px 12px;
    border: 1px solid var(--border);
    background: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    border-radius: 1px;
    outline: none;
    transition: border-color 0.2s;
    letter-spacing: 1px;
  }

  .apikey-wrap input:focus { border-color: var(--gemini-blue); }
  .apikey-wrap input.claude-focus:focus { border-color: var(--claude-orange); }

  .apikey-toggle {
    position: absolute; right: 10px;
    background: none; border: none; cursor: pointer;
    color: var(--muted); padding: 2px;
    display: flex; align-items: center;
  }

  .apikey-toggle:hover { color: var(--ink); }

  .apikey-status {
    font-size: 10px; margin-top: 6px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted);
  }
  .apikey-status.ok { color: var(--green); }
  .apikey-status.warn { color: var(--gold); }

  /* Divider between API settings and ticker input */
  .settings-divider {
    height: 1px; background: var(--border);
    margin: 0 -36px 20px; /* bleed to card edges */
  }

  /* ── REST of original styles ── */
  .input-row {
    display: flex; gap: 12px;
    align-items: flex-end; margin-bottom: 16px;
  }

  .field-group { flex: 1; }

  .field-group label {
    display: block; font-size: 10px;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px; font-weight: 500;
  }

  .field-group input, .field-group select {
    width: 100%; padding: 12px 14px;
    border: 1px solid var(--border); background: var(--paper);
    font-family: 'IBM Plex Mono', monospace; font-size: 15px;
    font-weight: 500; color: var(--ink); border-radius: 1px;
    outline: none; transition: border-color 0.2s; text-transform: uppercase;
  }

  .field-group input:focus, .field-group select:focus { border-color: var(--accent); }
  .field-group.narrow { flex: 0 0 120px; }

  .btn-generate {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; width: 100%; padding: 14px;
    background: var(--ink); color: white; border: none;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 13px;
    font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; border-radius: 1px; transition: background 0.2s, transform 0.1s;
  }
  .btn-generate:hover { background: var(--accent); }
  .btn-generate:active { transform: scale(0.99); }
  .btn-generate:disabled { background: var(--muted); cursor: not-allowed; }
  .btn-generate svg { width: 16px; height: 16px; }

  .disclaimer {
    font-size: 10px; color: var(--muted); text-align: center;
    margin-top: 10px; line-height: 1.6;
  }

  /* ── PROGRESS ── */
  .progress-wrap {
    display: none; width: 100%; max-width: 600px;
    margin-top: 24px; background: white;
    border: 1px solid var(--border); padding: 20px 24px;
  }
  .progress-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .progress-bar-bg { height: 3px; background: var(--cream); border-radius: 2px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width 0.4s ease; }
  .progress-step { font-size: 12px; color: var(--muted); margin-top: 8px; font-family: 'IBM Plex Mono', monospace; }

  /* ── REPORT ── */
  #report-area { display: none; width: 100%; max-width: 860px; margin-top: 32px; }

  .report-toolbar {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 16px; padding: 0 4px;
  }
  .report-toolbar span { font-size: 11px; color: var(--muted); letter-spacing: 1px; }

  .btn-pdf {
    display: flex; align-items: center; gap: 7px; padding: 10px 20px;
    background: var(--accent); color: white; border: none;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 11px;
    font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; border-radius: 1px; transition: opacity 0.2s;
  }
  .btn-pdf:hover { opacity: 0.85; }
  .btn-pdf svg { width: 14px; height: 14px; }

  .report-doc { background: white; border: 1px solid var(--border); box-shadow: 0 4px 32px rgba(0,0,0,0.08); }

  .report-header { padding: 44px 52px 32px; border-bottom: 3px solid var(--ink); position: relative; }
  .report-header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .report-pub { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
  .report-date { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 2px; color: var(--muted); }
  .report-ticker { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 3px; color: var(--accent); font-weight: 500; margin-bottom: 6px; }
  .report-company { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 700; line-height: 1.1; color: var(--ink); margin-bottom: 12px; }
  .report-tagline { font-size: 13px; color: var(--muted); font-weight: 300; max-width: 560px; line-height: 1.6; border-left: 2px solid var(--accent); padding-left: 12px; }
  .report-meta-row { display: flex; gap: 32px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .report-meta-item label { display: block; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .report-meta-item .val { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; color: var(--ink); }
  .report-meta-item .val.up { color: var(--green); }
  .report-meta-item .val.down { color: var(--red); }

  .report-body { padding: 0 52px 52px; }

  .report-section { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--border); }
  .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
  .section-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; color: var(--ink); margin-bottom: 16px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .intro-text { font-size: 13.5px; line-height: 1.85; color: #2a2520; font-weight: 300; }

  .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); margin-top: 4px; }
  .metric-card { background: white; padding: 16px 14px; }
  .metric-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .metric-value { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 500; color: var(--ink); line-height: 1; }
  .metric-value.up { color: var(--green); }
  .metric-value.down { color: var(--red); }
  .metric-sub { font-size: 10px; color: var(--muted); margin-top: 4px; }

  .quarterly-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  .quarterly-table th { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); padding: 8px 12px; text-align: right; border-bottom: 2px solid var(--ink); background: var(--paper); }
  .quarterly-table th:first-child { text-align: left; }
  .quarterly-table td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--border); font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink); }
  .quarterly-table td:first-child { text-align: left; font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 1px; }
  .quarterly-table tr:last-child td { border-bottom: none; }
  .quarterly-table tr:nth-child(even) td { background: var(--paper); }
  .td-up { color: var(--green) !important; font-weight: 500; }
  .td-down { color: var(--red) !important; font-weight: 500; }

  .news-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .news-item:last-child { border-bottom: none; }
  .news-date { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 2px; color: var(--muted); margin-bottom: 4px; }
  .news-headline { font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 5px; line-height: 1.4; }
  .news-body { font-size: 12px; color: var(--muted); line-height: 1.6; font-weight: 300; }
  .news-tag { display: inline-block; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; padding: 2px 7px; background: var(--accent-light); color: var(--accent); border-radius: 1px; margin-bottom: 6px; font-weight: 500; }

  .highlight-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .highlight-list li { display: flex; gap: 10px; font-size: 13px; line-height: 1.6; font-weight: 300; color: #2a2520; }
  .highlight-list li::before { content: '▸'; color: var(--green); flex-shrink: 0; margin-top: 1px; font-size: 10px; }
  .risk-list li::before { content: '▸'; color: var(--red) !important; }

  .tv-container { width: 100%; height: 320px; border: 1px solid var(--border); background: var(--paper); overflow: hidden; margin-top: 8px; }
  .tv-container iframe { width: 100%; height: 100%; border: none; }

  .report-footer { margin: 40px 52px 0; padding: 16px 0; border-top: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: center; }
  .footer-brand { font-family: 'Playfair Display', serif; font-size: 13px; color: var(--ink); font-weight: 600; }
  .footer-disclaimer { font-size: 9px; color: var(--muted); max-width: 400px; text-align: right; line-height: 1.5; }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media print {
    @page { size: A4; margin: 15mm 14mm; }
    body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .screen-ui > *:not(#report-area) { display: none !important; }
    .report-toolbar { display: none !important; }
    #print-tip { display: none !important; }
    #report-area { display: block !important; margin: 0; }
    .report-doc { box-shadow: none !important; border: none !important; }
    .report-section { page-break-inside: avoid; }
    .tv-container { height: 260px; }
    .metrics-grid { page-break-inside: avoid; }
    .quarterly-table { page-break-inside: avoid; }
    .report-header { padding: 32px 40px 24px !important; }
    .report-body { padding: 0 40px 40px !important; }
    .report-footer { margin: 32px 40px 0 !important; }
  }

  .error-box { background: #fff5f5; border: 1px solid #fcc; padding: 16px 20px; border-radius: 2px; font-size: 13px; color: var(--red); margin-top: 16px; display: none; }

  .btn-test-api {
    display: inline-flex; align-items: center; gap: 5px;
    margin-top: 8px; padding: 5px 12px;
    background: none; border: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: var(--muted); cursor: pointer; border-radius: 2px;
    transition: all 0.15s; letter-spacing: 1px;
  }
  .btn-test-api:hover { border-color: var(--ink); color: var(--ink); }
  .btn-test-api:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div class="screen-ui">

  <!-- Masthead -->
  <div class="masthead">
    <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:0;line-height:1;">
        <div style="background:#003087;color:white;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:700;padding:5px 10px;letter-spacing:1px;">永豐</div>
        <div style="background:#E2001A;color:white;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:700;padding:5px 10px;letter-spacing:1px;">銀行</div>
      </div>
      <div style="width:1px;height:28px;background:#d8d0c4;"></div>
      <h1 style="font-size:24px;font-family:'Playfair Display',serif;font-weight:700;color:#0f0f0f;margin:0;">個股研究報告產生器</h1>
    </div>
    <div style="font-size:11px;color:#6b6560;font-family:'IBM Plex Sans',sans-serif;font-weight:300;">財務行銷部 · 內部工具</div>
  </div>

  <!-- Input Card -->
  <div class="input-card">

    <!-- ══ API 設定區 ══ -->
    <div class="api-settings-section">
      <span class="section-row-label">API 設定 · Provider &amp; Model</span>

      <!-- Provider Toggle -->
      <div class="provider-toggle">
        <button class="provider-btn active" data-provider="gemini" onclick="switchProvider('gemini')">
          <!-- Google G icon -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Gemini
        </button>
        <button class="provider-btn" data-provider="claude" onclick="switchProvider('claude')">
          <!-- Anthropic icon -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.33 5.14L21.5 18.86h-3.1l-.84-2.8H13.6l-.84 2.8H9.66L13.83 5.14h3.5zM15.58 8.4l-1.4 4.9h2.8l-1.4-4.9zM9.1 5.14L5 18.86h3.1l.84-2.8h3.95l.84 2.8h3.1L12.6 5.14H9.1z" opacity=".7"/>
          </svg>
          Claude
        </button>
      </div>

      <!-- Model Pills — Gemini -->
      <div id="gemini-models" class="model-select-row">
        <label>模型</label>
        <div class="model-pill-group">
          <button class="model-pill active" data-provider="gemini" data-model="gemini-2.5-flash" onclick="selectModel(this)">2.5 Flash ★</button>
          <button class="model-pill" data-provider="gemini" data-model="gemini-2.5-pro" onclick="selectModel(this)">2.5 Pro</button>
          <button class="model-pill" data-provider="gemini" data-model="gemini-2.5-flash-lite" onclick="selectModel(this)">2.5 Flash-Lite</button>
          <button class="model-pill" data-provider="gemini" data-model="gemini-3-flash-preview" onclick="selectModel(this)">3 Flash <span style="font-size:9px;opacity:.7">Preview</span></button>
        </div>
        <!-- Google Search 開關 -->
        <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:var(--muted);user-select:none;">
            <input type="checkbox" id="use-google-search" checked style="width:13px;height:13px;accent-color:var(--gemini-blue);">
            <span>啟用 Google Search Grounding</span>
          </label>
          <span style="font-size:9px;font-family:'IBM Plex Mono',monospace;color:var(--muted);background:var(--paper);border:1px solid var(--border);padding:2px 6px;border-radius:2px;">建議開啟以取得最新財務資料</span>
        </div>
      </div>

      <!-- Model Pills — Claude (hidden by default) -->
      <div id="claude-models" class="model-select-row" style="display:none;">
        <label>模型</label>
        <div class="model-pill-group">
          <button class="model-pill active" data-provider="claude" data-model="claude-sonnet-4-5" onclick="selectModel(this)">Sonnet 4.5</button>
          <button class="model-pill" data-provider="claude" data-model="claude-opus-4-5" onclick="selectModel(this)">Opus 4.5</button>
          <button class="model-pill" data-provider="claude" data-model="claude-haiku-4-5-20251001" onclick="selectModel(this)">Haiku 4.5</button>
        </div>
      </div>

      <!-- Selected model info badge -->
      <div class="model-info-badge gemini" id="model-badge">
        <span class="dot"></span>
        <span id="model-badge-text">gemini-2.5-flash · Google Search 已啟用</span>

<script>
// ════════════════════════════════
// STATE
// ════════════════════════════════
let currentProvider = 'gemini';
let currentModel = 'gemini-2.5-flash';

const MODEL_INFO = {

  'gemini-2.5-pro':        { label: 'gemini-2.5-pro · 最高品質 · GA 穩定版', provider: 'gemini' },
  'gemini-2.5-flash-lite': { label: 'gemini-2.5-flash-lite · 最低成本 · GA 穩定版', provider: 'gemini' },
  'gemini-3-flash-preview':{ label: 'gemini-3-flash-preview · 最新世代 · Preview', provider: 'gemini' },
  'claude-sonnet-4-5': { label: 'claude-sonnet-4-5 · 均衡智能', provider: 'claude' },
  'claude-opus-4-5':   { label: 'claude-opus-4-5 · 最高品質', provider: 'claude' },
  'claude-haiku-4-5-20251001': { label: 'claude-haiku-4-5 · 速度最快', provider: 'claude' },
};

// ════════════════════════════════
// PROVIDER / MODEL UI
// ════════════════════════════════
function switchProvider(provider) {
  currentProvider = provider;

  // Toggle buttons
  document.querySelectorAll('.provider-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.provider === provider);
  });

  // Show/hide model rows
  document.getElementById('gemini-models').style.display = provider === 'gemini' ? 'flex' : 'none';
  document.getElementById('claude-models').style.display = provider === 'claude' ? 'flex' : 'none';

  // Set default model for provider
  if (provider === 'gemini') {
    currentModel = 'gemini-2.5-flash';
    document.getElementById('apikey-label').textContent = 'Google Gemini API Key';
    document.getElementById('api-key-input').placeholder = 'AIzaSy...';
    document.getElementById('api-key-input').className = '';
  } else {
    currentModel = 'claude-sonnet-4-5';
    document.getElementById('apikey-label').textContent = 'Anthropic Claude API Key';
    document.getElementById('api-key-input').placeholder = 'sk-ant-...';
    document.getElementById('api-key-input').className = 'claude-focus';
  }

  // Reset pill active states
  document.querySelectorAll(`#${provider}-models .model-pill`).forEach((pill, i) => {
    pill.classList.toggle('active', i === 0);
  });

  updateModelBadge();
  onApiKeyChange();

  // Restore saved key for this provider
  const saved = localStorage.getItem(`api_key_${provider}`);
  if (saved) {
    document.getElementById('api-key-input').value = saved;
    onApiKeyChange();
  } else {
    document.getElementById('api-key-input').value = '';
    onApiKeyChange();
  }
}

function selectModel(btn) {
  const provider = btn.dataset.provider;
  currentModel = btn.dataset.model;

  // Deactivate siblings, activate this
  document.querySelectorAll(`#${provider}-models .model-pill`).forEach(p => p.classList.remove('active'));
  btn.classList.add('active');

  updateModelBadge();
}

function updateModelBadge() {
  const badge = document.getElementById('model-badge');
  const info = MODEL_INFO[currentModel] || { label: currentModel, provider: currentProvider };
  badge.className = `model-info-badge ${currentProvider}`;
  const searchOn = currentProvider === 'gemini' && document.getElementById('use-google-search')?.checked;
  const searchTag = searchOn ? ' · 🔍 Google Search ON' : '';
  document.getElementById('model-badge-text').textContent = info.label + searchTag;
}

// ════════════════════════════════
// API KEY
// ════════════════════════════════
function getApiKey() {
  return document.getElementById('api-key-input').value.trim();
}

function onApiKeyChange() {
  const key = getApiKey();
  const status = document.getElementById('apikey-status');
  const testBtn = document.getElementById('btn-test-api');
  const testResult = document.getElementById('test-result');
  testResult.style.display = 'none';

  if (!key) {
    status.className = 'apikey-status';
    status.textContent = '請輸入您的 API Key 以啟用報告生成';
    testBtn.style.display = 'none';
    return;
  }

  if (currentProvider === 'gemini') {
    if (key.startsWith('AIza') && key.length > 20) {
      status.className = 'apikey-status ok';
      status.textContent = '✓ Gemini API Key 格式正確';
      testBtn.style.display = 'inline-flex';
      localStorage.setItem('api_key_gemini', key);
    } else {
      status.className = 'apikey-status warn';
      status.textContent = '⚠ Gemini Key 一般以 AIzaSy 開頭';
      testBtn.style.display = 'none';
    }
  } else {
    if (key.startsWith('sk-ant-') && key.length > 20) {
      status.className = 'apikey-status ok';
      status.textContent = '✓ Claude API Key 格式正確';
      testBtn.style.display = 'inline-flex';
      localStorage.setItem('api_key_claude', key);
    } else {
      status.className = 'apikey-status warn';
      status.textContent = '⚠ Claude Key 一般以 sk-ant- 開頭';
      testBtn.style.display = 'none';
    }
  }
}

function toggleApiKeyVisibility() {
  const input = document.getElementById('api-key-input');
  input.type = input.type === 'password' ? 'text' : 'password';
}

// Auto-load saved key on page load
window.addEventListener('DOMContentLoaded', () => {
  const savedGemini = localStorage.getItem('api_key_gemini');
  if (savedGemini) {
    document.getElementById('api-key-input').value = savedGemini;
    onApiKeyChange();
  }
  updateModelBadge();
});

// ════════════════════════════════
// API CALLS
// ════════════════════════════════
async function callGemini(prompt, systemPrompt) {
  const apiKey = getApiKey();
  const modelId = currentModel;
  const useSearch = document.getElementById('use-google-search')?.checked ?? true;
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${apiKey}`;

  const reqBody = {
    contents: [{ parts: [{ text: systemPrompt + '\n\n' + prompt }] }]
  };
  if (useSearch) reqBody.tools = [{ googleSearch: {} }];

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(reqBody)
  });

  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    let apiMsg = errText.slice(0, 300);
    try { apiMsg = JSON.parse(errText)?.error?.message || apiMsg; } catch(e) {}
    if (apiMsg.includes('API key not valid')) throw new Error('Gemini API Key 無效，請確認金鑰是否正確');
    if (apiMsg.includes('no longer available') || apiMsg.includes('not available to new users')) {
      throw new Error(`模型 ${modelId} 對新用戶已停用，請改用 2.5 Flash 或 2.5 Pro`);
    }
    if (res.status === 404 || apiMsg.includes('not found')) {
      throw new Error(`模型 ${modelId} 不存在，請改用其他模型`);
    }
    throw new Error(`Gemini API 錯誤 ${res.status}：${apiMsg}`);
  }

  const data = await res.json();
  const parts = data?.candidates?.[0]?.content?.parts || [];
  return parts.filter(p => p.text).map(p => p.text).join('\n');
}

async function callClaude(prompt, systemPrompt) {
  const apiKey = getApiKey();
  const modelId = currentModel;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: modelId,
      max_tokens: 4096,
      system: systemPrompt,
      messages: [{ role: 'user', content: prompt }]
    })
  });

  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    if (res.status === 401) throw new Error('Claude API Key 無效，請確認金鑰是否正確');
    if (res.status === 404) throw new Error(`模型 ${modelId} 不存在，請嘗試其他模型`);
    throw new Error(`Claude API 錯誤 ${res.status}：${errText.slice(0, 120)}`);
  }

  const data = await res.json();
  return data?.content?.filter(b => b.type === 'text').map(b => b.text).join('\n') || '';
}

async function callAI(prompt, systemPrompt) {
  if (currentProvider === 'gemini') return callGemini(prompt, systemPrompt);
  return callClaude(prompt, systemPrompt);
}

// ════════════════════════════════
// TEST API CONNECTION
// ════════════════════════════════
async function testApiConnection() {
  const btn = document.getElementById('btn-test-api');
  const result = document.getElementById('test-result');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="border-color:rgba(0,0,0,0.2);border-top-color:#555;width:10px;height:10px;"></span> 測試中...';
  result.style.display = 'none';

  try {
    const t0 = Date.now();
    if (currentProvider === 'gemini') {
      const apiKey = getApiKey();
      const useSearch = document.getElementById('use-google-search')?.checked ?? false;
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${apiKey}`;
      const testBody = { contents: [{ parts: [{ text: 'Reply with exactly: OK' }] }] };
      // 測試時不帶 Google Search，避免干擾連線測試本身
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(testBody)
      });
      const ms = Date.now() - t0;
      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        let msg = `HTTP ${res.status}`;
        try { msg = JSON.parse(errText)?.error?.message || msg; } catch(e) {}
        if (msg.includes('no longer available') || msg.includes('not available to new users')) {
          throw new Error(`${currentModel} 對新用戶已停用，請改用 2.5 Flash 或 2.5 Pro`);
        }
        throw new Error(msg);
      }
      const data = await res.json();
      const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || '（無回應）';
      const searchNote = useSearch ? ' · Google Search ON' : ' · Google Search OFF';
      result.style.display = 'block';
      result.style.background = '#f0faf5';
      result.style.border = '1px solid #1a6b3c44';
      result.style.color = '#1a6b3c';
      result.textContent = `✓ 連線成功 · ${currentModel} · ${ms}ms${searchNote} · 回應：${reply.slice(0,30)}`;
    } else {
      const apiKey = getApiKey();
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'x-api-key':apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
        body: JSON.stringify({ model: currentModel, max_tokens: 16, messages: [{ role:'user', content:'Reply with exactly: OK' }] })
      });
      const ms = Date.now() - t0;
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error?.message || `HTTP ${res.status}`);
      }
      const data = await res.json();
      const reply = data?.content?.[0]?.text || '（無回應）';
      result.style.display = 'block';
      result.style.background = '#f0faf5';
      result.style.border = '1px solid #1a6b3c44';
      result.style.color = '#1a6b3c';
      result.textContent = `✓ 連線成功 · ${currentModel} · ${ms}ms · 回應：${reply.slice(0,40)}`;
    }
  } catch(e) {
    result.style.display = 'block';
    result.style.background = '#fff5f5';
    result.style.border = '1px solid #fcc';
    result.style.color = '#c8381a';
    result.textContent = `✗ 連線失敗：${e.message}`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M5 12h14M12 5l7 7-7 7"/></svg> 測試連線';
  }
}

    setProgress(30, `[${currentModel}] 搜尋財務數據...`);
    const raw = await callAI(prompt, systemPrompt);

    setProgress(75, '解析報告數據...');
    let data;
    try {
      const cleaned = raw.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
      data = JSON.parse(cleaned);
    } catch(e) {
      const match = raw.match(/\{[\s\S]*\}/);
      if (match) data = JSON.parse(match[0]);
      else throw new Error('無法解析 AI 回應，請重試');
    }

    setProgress(90, '建立報告頁面...');
    window._reportData = data;
    renderReport(data, ticker, market);

    setProgress(100, '完成！');
    setTimeout(() => {
      document.getElementById('progress-wrap').style.display = 'none';
      document.getElementById('report-area').style.display = 'block';
    }, 400);

  } catch(err) {
    showError(err.message || '生成失敗，請稍後重試');
    document.getElementById('progress-wrap').style.display = 'none';
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg> 生成研究報告`;
  }
}

function colorClass(val) {
  if (!val) return '';
  const str = String(val);
  if (str.startsWith('+') || str.startsWith('▲')) return 'td-up';
  if (str.startsWith('-') || str.startsWith('▼')) return 'td-down';
  return '';
}

    addHeader(s6, '05', 'INVESTMENT THESIS', '投資亮點 vs 主要風險');
    s6.addShape(pres.shapes.RECTANGLE, { x:0.45, y:1.0, w:4.52, h:4.22, fill:{color:'f4faf7'}, line:{color:C.green, width:0.8} });
    s6.addShape(pres.shapes.RECTANGLE, { x:0.45, y:1.0, w:4.52, h:0.07, fill:{color:C.green}, line:{color:C.green} });
    s6.addText('投資亮點  Highlights', { x:0.58, y:1.12, w:4.2, h:0.32, fontSize:11, bold:true, color:C.green, fontFace:'Georgia', margin:0 });
    s6.addShape(pres.shapes.LINE, { x:0.58, y:1.47, w:4.2, h:0, line:{color:C.green, width:0.4} });
    const hlItems = (d.highlights||[]).map((h, idx, arr) => ({ text:h, options:{ bullet:true, breakLine:idx<arr.length-1, fontSize:10, color:'1a2820', paraSpaceAfter:7, fontFace:'Calibri' } }));
    if (hlItems.length) s6.addText(hlItems, { x:0.58, y:1.55, w:4.2, h:3.55, valign:'top', margin:0 });
    s6.addShape(pres.shapes.RECTANGLE, { x:5.08, y:1.0, w:4.52, h:4.22, fill:{color:'fdf5f5'}, line:{color:C.red, width:0.8} });
    s6.addShape(pres.shapes.RECTANGLE, { x:5.08, y:1.0, w:4.52, h:0.07, fill:{color:C.red}, line:{color:C.red} });
    s6.addText('主要風險  Key Risks', { x:5.22, y:1.12, w:4.2, h:0.32, fontSize:11, bold:true, color:C.red, fontFace:'Georgia', margin:0 });
    s6.addShape(pres.shapes.LINE, { x:5.22, y:1.47, w:4.2, h:0, line:{color:C.red, width:0.4} });
    const riskItems = (d.risks||[]).map((r, idx, arr) => ({ text:r, options:{ bullet:true, breakLine:idx<arr.length-1, fontSize:10, color:'28101a', paraSpaceAfter:7, fontFace:'Calibri' } }));
    if (riskItems.length) s6.addText(riskItems, { x:5.22, y:1.55, w:4.2, h:3.55, valign:'top', margin:0 });
    addFooter(s6);

    // SLIDE 7 — Analyst Consensus
    const s7 = pres.addSlide();
    s7.background = { color: C.paper };
    s7.addShape(pres.shapes.RECTANGLE, { x:0, y:0, w:10, h:0.09, fill:{color:C.ink}, line:{color:C.ink} });
    s7.addText('06 — ANALYST CONSENSUS · 永豐銀行財務行銷部', { x:0.55, y:0.18, w:9, h:0.26, fontSize:8, color:C.accent, bold:true, charSpacing:4, fontFace:'Georgia', margin:0 });
    s7.addText('分析師共識', { x:0.55, y:0.44, w:9, h:0.65, fontSize:32, bold:true, color:C.ink, fontFace:'Georgia', margin:0 });
    s7.addShape(pres.shapes.LINE, { x:0.55, y:1.12, w:8.9, h:0, line:{color:C.ink, width:1.5} });
    const consensusCards = [
      { label:'評級 Rating', val: ac.rating||'—', accent: ac.rating==='買入' ? C.green : ac.rating==='賣出' ? C.red : C.gold },
      { label:'目標股價 Target Price', val: ac.targetPrice||'—', accent: C.gold },
      { label:'上下行空間', val: ac.updownside||'—', accent: (ac.updownside||'').startsWith('+') ? C.green : C.red },
    ];
    consensusCards.forEach((c, i) => {
      const cx = 0.55 + i * 3.05;
      s7.addShape(pres.shapes.RECTANGLE, { x:cx, y:1.25, w:2.85, h:2.1, fill:{color:C.white}, line:{color:C.border, width:0.6} });
      s7.addShape(pres.shapes.RECTANGLE, { x:cx, y:1.25, w:2.85, h:0.07, fill:{color:c.accent}, line:{color:c.accent} });
      s7.addText(c.label, { x:cx+0.15, y:1.4, w:2.55, h:0.3, fontSize:8, color:C.muted, charSpacing:0.5, margin:0 });
      s7.addText(c.val, { x:cx+0.15, y:1.75, w:2.55, h:1.0, fontSize:30, bold:true, color:C.ink, fontFace:'Calibri', margin:0 });
    });
    s7.addShape(pres.shapes.LINE, { x:0.55, y:3.5, w:8.9, h:0, line:{color:C.border, width:0.5} });
    s7.addText(`本報告由 AI 自動生成（${currentModel}），內容僅供參考，不構成任何投資建議。`, { x:0.55, y:3.62, w:8.9, h:0.45, fontSize:8.5, color:C.muted, wrap:true, fontFace:'Calibri', lineSpacingMultiple:1.4, margin:0 });
    s7.addText(d.ticker||'', { x:3, y:3.8, w:6.5, h:1.55, fontSize:100, bold:true, color:'ece8e0', fontFace:'Georgia', align:'right', margin:0 });
    s7.addShape(pres.shapes.LINE, { x:0.55, y:5.38, w:8.9, h:0, line:{color:C.ink, width:0.75} });
    s7.addText('永豐銀行 財務行銷部 · ' + new Date().toLocaleDateString('zh-TW'), { x:0.55, y:5.42, w:8.9, h:0.18, fontSize:7.5, color:C.muted, align:'right', fontFace:'Calibri', margin:0 });

    pres.writeFile({ fileName: `${d.ticker}_${currentModel}_Report.pptx` });

  } catch(e) {
    alert('PPT 生成失敗：' + e.message);
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg> 生成 PPT`;
  }
}

// Enter key support
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('ticker-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') generateReport();
  });
  document.getElementById('use-google-search')?.addEventListener('change', updateModelBadge);
  // Restore last provider
  const lastProvider = localStorage.getItem('last_provider');
  if (lastProvider === 'claude') switchProvider('claude');
});
</script>
</body>
</html>
